name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Install engine dependencies
        run: npm ci --prefix engine --ignore-scripts --no-audit --no-fund
      - name: Test engine and formatter
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          python3 dev.py test
          python3 dev.py self-test
          python3 dev.py sanitize
      - name: Build Windows x86 and x64 packages
        run: python3 dev.py build
      - name: Verify package
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: python3 dev.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodeInk-${{ github.ref_name }}
          path: |
            dist/*
            build/reports/pe-validation.json
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "CodeInk $version" --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            "dist/CodeInk-Setup-$version-online.exe" dist/SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
